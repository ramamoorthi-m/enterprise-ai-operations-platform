name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        env:
          APP_NAME: Enterprise AI Operations Platform CI
          ENVIRONMENT: test
          LOG_LEVEL: INFO
          JIRA_URL: https://example.atlassian.net
          JIRA_EMAIL: ci@example.com
          JIRA_API_TOKEN: ci-placeholder
          JIRA_PROJECT_KEY: TEST
          GITHUB_TOKEN: ci-placeholder
          GITHUB_OWNER: ci-placeholder
          GITHUB_REPO: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
          GEMINI_MODEL: gemini-2.5-flash
          GROQ_API_KEY: ci-placeholder
        run: uv run --locked pytest -q

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Diagnose EC2 SSH connectivity
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Checking whether EC2_HOST matches the expected address..."

          if [ "$EC2_HOST" = "16.176.134.59" ]; then
            echo "EC2_HOST matches the current EC2 public IP."
          else
            echo "EC2_HOST does not match the current EC2 public IP."
          fi

          echo "Testing TCP port 22..."

          if timeout 10 bash -c 'echo > /dev/tcp/$EC2_HOST/22'; then
            echo "TCP port 22 is reachable."
          else
            echo "TCP port 22 is not reachable."
          fi

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /home/ec2-user/enterprise-ai-operations-platform
            git pull --ff-only origin main
            docker compose up -d --build
            docker compose ps