name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        env:
          APP_NAME: Enterprise AI Operations Platform CI
          ENVIRONMENT: test
          LOG_LEVEL: INFO
          JIRA_URL: https://example.atlassian.net
          JIRA_EMAIL: ci@example.com
          JIRA_API_TOKEN: ci-placeholder
          JIRA_PROJECT_KEY: TEST
          GITHUB_TOKEN: ci-placeholder
          GITHUB_OWNER: ci-placeholder
          GITHUB_REPO: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
          GEMINI_MODEL: gemini-2.5-flash
          GROQ_API_KEY: ci-placeholder
        run: uv run --locked pytest -q
