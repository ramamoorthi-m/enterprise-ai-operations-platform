[project]
name = "enterprise-ai-operations-platform"
version = "0.1.0"
description = "Enterprise-grade multi-agent AI operations platform built with LangGraph, FastAPI, and MCP-ready tool integrations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2",
    "langchain-google-genai>=4.3.2",
    "langgraph>=1.2.9",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
